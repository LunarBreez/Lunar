[package]
name = "lunar-flows-core"
description = "Cœur d'analyse de LUNAR : matrices de flux LFMS, CSV, graphe réseau et conversion PCAP"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true
publish = false

[features]
default = []
# La conversion PCAP tire libpcap (Npcap sous Windows) : optionnelle pour ne
# pas imposer cette dépendance système aux consommateurs matrice/CSV.
pcap = ["dep:pcap"]
# Lecture des matrices exportées en classeur XLSX : optionnelle pour ne pas
# imposer calamine (et sa pile zip) aux consommateurs qui ne lisent que du CSV.
xlsx = ["dep:calamine"]

# Règles communes du workspace : documentation complète, pas de panic évitable
# dans le code livré (les tests en gardent l'usage, voir clippy.toml).
[lints]
workspace = true

[dependencies]
calamine = { version = "=0.38.0", default-features = false, features = ["dates"], optional = true }
chrono = "0.4.45"
csv = "1.4.0"
log = "0.4.33"
packet_parser = "13.2.0"
pcap = { version = "2.4.0", optional = true }
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.19"

[dev-dependencies]
sha2 = "0.10.9"
