[package]
name = "lunar-engine"
description = "Moteur de LUNAR : capture, imports, labels, projet, exports"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# Instrumentation de la capture live et des imports PCAP (journal JSONL).
capture_timing = ["packet_parser/parse_timing"]

# Le lecteur XLSX est celui du cœur.
[dependencies]
lunar-flows-core = { path = "../lunar-flows-core", features = ["pcap", "xlsx"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1.0.150"
pcap = "2.4.0"
packet_parser = "11.8.2"
netdev = "0.42.0"
thiserror = "2.0.19"
# Empreinte du CSV joint à la synthèse HTML.
sha2 = "0.10.9"
crossbeam = "0.8.4"
log = "0.4.33"
chrono = "0.4.45"
libc = "0.2.186"
csv = "1.4.0"
zip = { version = "9.2.2", default-features = false, features = ["deflate"] }
dirs = "6.0.0"
sysinfo = "0.38.4"
