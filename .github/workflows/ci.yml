# Intégration continue : formatage, clippy et tests sous Linux, clippy et
# compilation sous Windows, à chaque push sur main et sur chaque pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Jeton en lecture seule : aucun job n'écrit dans le dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Moins d'informations de débogage : la cible de test tient dans le disque
  # du runner (gpui et ses dépendances sont volumineux).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  linux:
    name: Linux (fmt, clippy, tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dépendances système
        run: script/ci/install-linux-deps.sh

      - name: Toolchain Rust
        run: script/ci/install-toolchain.sh

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Le crate de fuzzing est un workspace à part : il se vérifie par son
      # propre manifeste.
      - name: Formatage
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path crates/lunar-flows-core/fuzz/Cargo.toml

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  windows:
    name: Windows (clippy, compilation)
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain Rust
        run: script/ci/install-toolchain.sh

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Compilation
        run: cargo build --locked -p lunar

      - name: Démarrage sans Npcap
        run: target/debug/lunar.exe --version

      # Le démarrage ci-dessus ne prouve le chargement différé que si le
      # runner n'a pas de wpcap.dll : le vérifier sur les imports du binaire.
      - name: Outils LLVM de la toolchain
        run: rustup component add llvm-tools

      - name: wpcap.dll en chargement différé
        run: script/ci/check-windows-npcap-delayload.sh target/debug/lunar.exe

  # Avis de sécurité RustSec, licences, doublons et sources des dépendances,
  # selon deny.toml.
  deny:
    name: Dépendances (cargo-deny)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain Rust
        run: script/ci/install-toolchain.sh

      - name: cargo-deny
        run: script/ci/install-cargo-deny.sh

      - name: Vérification des dépendances
        run: cargo deny --locked check

  # Deux contrôles de plus sur les dépendances, pour le produit et pour le
  # crate de fuzzing. cargo-audit relit les avis RustSec, en doublon voulu de
  # cargo-deny. cargo-vet exige que chaque crate, à sa version exacte, soit
  # couvert par un audit (les nôtres ou ceux des organisations importées dans
  # supply-chain/) ou par une exemption explicite : une dépendance nouvelle
  # ou mise à jour fait échouer le job tant qu'elle n'est ni auditée ni
  # exemptée. Les audits importés sont figés dans supply-chain/imports.lock :
  # cargo-vet ne télécharge rien (--frozen).
  audits:
    name: Dépendances (cargo-audit, cargo-vet)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain Rust
        run: script/ci/install-toolchain.sh

      - name: cargo-audit
        run: script/ci/install-cargo-audit.sh

      - name: cargo-vet
        run: script/ci/install-cargo-vet.sh

      - name: Avis de sécurité RustSec
        run: |
          cargo audit
          cargo audit --file crates/lunar-flows-core/fuzz/Cargo.lock

      - name: Audits de la chaîne d'approvisionnement
        run: |
          cargo vet --locked --frozen
          cargo vet --locked --frozen --store-path supply-chain \
            --manifest-path crates/lunar-flows-core/fuzz/Cargo.toml

  # Dépendances déclarées dans un Cargo.toml mais jamais utilisées : chacune
  # est une surface d'attaque et un coût de relecture pour rien.
  udeps:
    name: Dépendances inutilisées (cargo-udeps)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dépendances système
        run: script/ci/install-linux-deps.sh

      - name: cargo-udeps et toolchain nightly
        run: script/ci/install-cargo-udeps.sh

      - name: Dépendances inutilisées
        run: script/ci/check-unused-deps.sh

  # Chaîne d'approvisionnement : vendor/ doit être exactement ce que crates.io
  # fournit pour les Cargo.lock. Tous les autres jobs compilent depuis vendor/
  # (.cargo/config.toml) ; celui-ci est le seul à interroger crates.io.
  vendor:
    name: Dépendances vendorisées intactes
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain Rust
        run: script/ci/install-toolchain.sh

      - name: vendor/ identique aux sources de crates.io
        run: script/vendor.sh --verify

  # Fuzzing borné des lecteurs de fichiers non fiables (capture PCAP, matrice
  # CSV, relevé WinAudit) : la CI prouve à chaque push que les cibles
  # s'exécutent et qu'aucun crash trivial n'existe. Les campagnes longues se
  # font hors CI (crates/lunar-flows-core/fuzz/README.md).
  fuzz:
    name: Fuzzing borné (cargo-fuzz)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dépendances système
        run: script/ci/install-linux-deps.sh --core

      - name: cargo-fuzz et toolchain nightly
        run: script/ci/install-cargo-fuzz.sh

      # Le crate de fuzzing a son propre Cargo.lock : il doit porter les
      # versions du produit, sinon le fuzzing teste autre chose que le code
      # livré.
      - name: Cargo.lock du fuzzing aligné sur celui du produit
        run: script/fuzz/sync-lock.sh --check

      - name: Fuzzing borné
        run: script/fuzz/smoke.sh

      - name: Entrées de crash
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: crates/lunar-flows-core/fuzz/artifacts/
          if-no-files-found: ignore

  # Garde-fous de la release : un contrôle qu'on n'a jamais vu échouer ne
  # prouve rien. Le test fabrique des binaires émetteurs et vérifie que le
  # contrôle de passivité les refuse.
  gardes:
    name: Garde-fous de release
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # libpcap rend compilable le cas central (binaire important
      # pcap_sendpacket) ; REQUIRE_LIBPCAP=1 interdit au test de le sauter.
      - name: Dépendances système
        run: script/ci/install-linux-deps.sh --core

      - name: Le contrôle de passivité refuse un binaire émetteur
        run: script/ci/tests/test-check-binary-is-passive.sh
        env:
          REQUIRE_LIBPCAP: "1"

      - name: Le contrôle de wpcap.dll refuse un import direct
        run: script/ci/tests/test-check-windows-npcap-delayload.sh

      - name: Le plancher glibc refuse un binaire trop récent
        run: script/ci/tests/test-check-binary-glibc-floor.sh
        env:
          REQUIRE_CC: "1"
