# Intégration continue : formatage, clippy et tests sous Linux, clippy et
# compilation sous Windows, à chaque push sur main et sur chaque pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Jeton en lecture seule : aucun job n'écrit dans le dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # Moins d'informations de débogage : la cible de test tient dans le disque
  # du runner (gpui et ses dépendances sont volumineux).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  linux:
    name: Linux (fmt, clippy, tests)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dépendances système
        run: script/ci/install-linux-deps.sh

      - name: Toolchain Rust
        run: script/ci/install-toolchain.sh

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # Le crate de fuzzing est un workspace à part : il se vérifie par son
      # propre manifeste.
      - name: Formatage
        run: |
          cargo fmt --check
          cargo fmt --check --manifest-path crates/lunar-flows-core/fuzz/Cargo.toml

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  windows:
    name: Windows (clippy, compilation)
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain Rust
        run: script/ci/install-toolchain.sh

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Compilation
        run: cargo build --locked -p lunar

      - name: Démarrage sans Npcap
        run: target/debug/lunar.exe --version

  # Avis de sécurité RustSec, licences, doublons et sources des dépendances,
  # selon deny.toml.
  deny:
    name: Dépendances (cargo-deny)
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain Rust
        run: script/ci/install-toolchain.sh

      - name: cargo-deny
        run: script/ci/install-cargo-deny.sh

      - name: Vérification des dépendances
        run: cargo deny --locked check

  # Fuzzing borné des lecteurs de fichiers non fiables (capture PCAP, matrice
  # CSV, relevé WinAudit) : la CI prouve à chaque push que les cibles
  # s'exécutent et qu'aucun crash trivial n'existe. Les campagnes longues se
  # font hors CI (crates/lunar-flows-core/fuzz/README.md).
  fuzz:
    name: Fuzzing borné (cargo-fuzz)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dépendances système
        run: script/ci/install-linux-deps.sh --core

      - name: cargo-fuzz et toolchain nightly
        run: script/ci/install-cargo-fuzz.sh

      # Le crate de fuzzing a son propre Cargo.lock : il doit porter les
      # versions du produit, sinon le fuzzing teste autre chose que le code
      # livré.
      - name: Cargo.lock du fuzzing aligné sur celui du produit
        run: script/fuzz/sync-lock.sh --check

      - name: Fuzzing borné
        run: script/fuzz/smoke.sh

      - name: Entrées de crash
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: crates/lunar-flows-core/fuzz/artifacts/
          if-no-files-found: ignore

  # Garde-fous de la release : un contrôle qu'on n'a jamais vu échouer ne
  # prouve rien. Le test fabrique des binaires émetteurs et vérifie que le
  # contrôle de passivité les refuse.
  gardes:
    name: Garde-fous de release
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # libpcap rend compilable le cas central (binaire important
      # pcap_sendpacket) ; REQUIRE_LIBPCAP=1 interdit au test de le sauter.
      - name: Dépendances système
        run: script/ci/install-linux-deps.sh --core

      - name: Le contrôle de passivité refuse un binaire émetteur
        run: script/ci/tests/test-check-binary-is-passive.sh
        env:
          REQUIRE_LIBPCAP: "1"
