# Publication d'une version : binaires Linux et Windows, smoke tests, SBOM,
# attestation de provenance, signature Sigstore, SHA256SUMS et release GitHub
# (brouillon, rendu public une fois tous les fichiers en place).
#
# - Push d'un tag vX.Y.Z (égal à la version du workspace) : construit, teste,
#   atteste, signe, vérifie et publie la release.
# - Lancement manuel (workflow_dispatch) : release à blanc. Toute la chaîne
#   tourne, vérifications comprises, sur des fichiers étiquetés
#   X.Y.Z-dev.<commit> ; seuls les jobs `publish` et `finalize` sont sautés.
#   Le jeu complet reste dans l'artefact `release-files` du run. Aucune
#   release, aucun tag ; les signatures et attestations d'essai sont en
#   revanche inscrites au journal public Sigstore, liées à la branche et non
#   à un tag.
name: Release
run-name: ${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || format('Release à blanc ({0})', github.ref_name) }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  COSIGN_VERSION: v3.0.6

jobs:
  version:
    name: Version
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      label: ${{ steps.version.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version du workspace et du tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [[ -n "$version" ]] || { echo "version introuvable dans Cargo.toml" >&2; exit 1; }
          if [[ "$REF_TYPE" == "tag" ]]; then
            [[ "$REF_NAME" == "v$version" ]] ||
              { echo "le tag $REF_NAME ne correspond pas à la version $version" >&2; exit 1; }
            label="$version"
          else
            label="$version-dev.${SHA:0:7}"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "label=$label" >>"$GITHUB_OUTPUT"
          echo "Version $version, archives étiquetées $label"

  linux:
    name: Linux x86_64
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    # L'attestation et la signature sont produites par le job qui a construit
    # les octets.
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      LABEL: ${{ needs.version.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dépendances système
        run: script/ci/install-linux-deps.sh --smoke

      - name: Toolchain Rust
        run: script/ci/install-toolchain.sh

      - name: Compilation release
        run: cargo build --release --locked -p lunar

      # LUNAR écoute sans émettre : aucune primitive d'émission libpcap
      # importée, aucun client HTTP embarqué. Vérifié sur le binaire livré.
      - name: Passivité du binaire
        run: script/ci/check-binary-is-passive.sh target/release/lunar
        env:
          EXPECT_LIBPCAP: "1"

      # Cible livrée : Ubuntu 22.04, glibc 2.35. Un runner plus récent ferait
      # exiger au binaire des symboles que la cible n'a pas.
      - name: Plancher glibc du binaire
        run: script/ci/check-binary-glibc-floor.sh target/release/lunar 2.35

      - name: Smoke test
        run: script/ci/smoke-linux.sh target/release/lunar

      - name: Archive
        run: |
          name="lunar-$LABEL-x86_64-linux-gnu"
          mkdir -p "dist/$name"
          cp target/release/lunar LICENSE.md README.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -r "dist/$name"
          ls -l dist

      - name: Attestation de provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Signature Sigstore
        run: |
          for archive in dist/*.tar.gz; do
            cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
          done
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lunar-linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows x86_64
    needs: version
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        shell: bash
    env:
      LABEL: ${{ needs.version.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain Rust
        run: script/ci/install-toolchain.sh

      # gpui précompile ses shaders avec fxc.exe en release : prendre celui
      # du Windows SDK le plus récent installé sur le runner.
      - name: Compilateur de shaders fxc.exe
        run: |
          fxc="$(find "/c/Program Files (x86)/Windows Kits/10/bin" -maxdepth 3 -path '*/10.*/x64/fxc.exe' | sort -V | tail -1)"
          [[ -n "$fxc" ]] || { echo "fxc.exe introuvable" >&2; exit 1; }
          echo "GPUI_FXC_PATH=$(cygpath -w "$fxc")" >>"$GITHUB_ENV"
          echo "fxc : $fxc"

      - name: Compilation release
        run: cargo build --release --locked -p lunar

      - name: Smoke test (sans Npcap)
        run: target/release/lunar.exe --version | grep -E '^lunar [0-9]'

      # LUNAR doit démarrer sans Npcap : wpcap.dll en chargement différé,
      # jamais en import direct. Vérifié sur le binaire livré.
      - name: Outils LLVM de la toolchain
        run: rustup component add llvm-tools

      - name: wpcap.dll en chargement différé
        run: script/ci/check-windows-npcap-delayload.sh target/release/lunar.exe

      - name: Archive
        run: |
          name="lunar-$LABEL-x86_64-windows"
          mkdir -p "dist/$name"
          cp target/release/lunar.exe LICENSE.md README.md "dist/$name/"
          (cd dist && 7z a -tzip "$name.zip" "$name" >/dev/null)
          rm -r "dist/$name"
          ls -l dist

      - name: Attestation de provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Signature Sigstore
        run: |
          for archive in dist/*.zip; do
            cosign sign-blob --yes --bundle "$archive.sigstore.json" "$archive"
          done
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lunar-windows
          path: dist/*
          if-no-files-found: error

  # Inventaire des dépendances (SBOM CycloneDX) de chaque cible, attesté et
  # signé comme les archives.
  sbom:
    name: SBOM
    needs: version
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      LABEL: ${{ needs.version.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain Rust
        run: script/ci/install-toolchain.sh

      - name: cargo-cyclonedx
        run: script/ci/install-cargo-cyclonedx.sh

      - name: SBOM CycloneDX
        run: script/ci/generate-sbom.sh "$LABEL" dist

      - name: Attestation de provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.cdx.json

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Signature Sigstore
        run: |
          for sbom in dist/*.cdx.json; do
            cosign sign-blob --yes --bundle "$sbom.sigstore.json" "$sbom"
          done
          ls -l dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lunar-sbom
          path: dist/*
          if-no-files-found: error

  # Rassemble les fichiers, calcule SHA256SUMS, puis vérifie chaque signature
  # et chaque attestation comme le ferait un utilisateur, avant toute
  # publication. Lecture seule : tourne aussi à blanc.
  assemble:
    name: Assemblage et vérification
    needs: [version, linux, windows, sbom]
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      LABEL: ${{ needs.version.outputs.label }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Identité attendue du signataire : ce workflow, à cette référence.
      IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/release.yml@${{ github.ref }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lunar-*
          path: dist
          merge-multiple: true

      - name: Jeu de fichiers attendu
        working-directory: dist
        run: |
          ls -l
          for file in \
            "lunar-$LABEL-x86_64-linux-gnu.tar.gz" \
            "lunar-$LABEL-x86_64-windows.zip" \
            "lunar-$LABEL-x86_64-linux-gnu.cdx.json" \
            "lunar-$LABEL-x86_64-windows.cdx.json"; do
            [[ -s "$file" && -s "$file.sigstore.json" ]] ||
              { echo "fichier ou signature manquant : $file" >&2; exit 1; }
          done
          [[ "$(find . -type f | wc -l)" -eq 8 ]] ||
            { echo "fichiers inattendus dans la release" >&2; exit 1; }

      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum -- *.tar.gz *.zip *.cdx.json >SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS

      - uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Vérification des signatures Sigstore
        working-directory: dist
        run: |
          for file in *.tar.gz *.zip *.cdx.json; do
            cosign verify-blob "$file" --bundle "$file.sigstore.json" \
              --certificate-identity "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com
          done

      - name: Vérification des attestations de provenance
        working-directory: dist
        run: |
          for file in *.tar.gz *.zip *.cdx.json; do
            gh attestation verify "$file" --repo "$GH_REPO" --cert-identity "$IDENTITY"
          done

      - name: Notes de release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cat >notes.md <<EOF
          LUNAR $VERSION : relevé de matrices de flux réseau, interface native gpui.

          - **Linux x86_64** (\`*-x86_64-linux-gnu.tar.gz\`) : X11 ou XWayland, GTK 3 et libpcap.
            Pour la capture en direct : \`sudo setcap cap_net_raw=eip ./lunar\`.
          - **Windows x86_64** (\`*-x86_64-windows.zip\`) : la capture exige [Npcap](https://npcap.com/).
            Sans Npcap, LUNAR démarre et importe des PCAP.
          - **SBOM** (\`*.cdx.json\`) : inventaire CycloneDX 1.5 des dépendances de chaque cible.

          Vérification :

          \`\`\`bash
          sha256sum -c SHA256SUMS
          gh attestation verify <fichier> --repo $GH_REPO
          cosign verify-blob <fichier> --bundle <fichier>.sigstore.json \\
            --certificate-identity "$IDENTITY" \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`
          EOF
          {
            if [[ "$REF_TYPE" == "tag" ]]; then
              echo "## Release $REF_NAME : fichiers vérifiés"
            else
              echo "## Release à blanc ($LABEL) : rien n'est publié"
            fi
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
            echo
            echo "### Notes de release"
            echo
            cat notes.md
          } >>"$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            dist/*
            notes.md
          if-no-files-found: error
          overwrite: true

  # Seul job qui écrit dans la release, avec les octets exacts que les jobs de
  # build ont testés, attestés et signés, et que `assemble` a vérifiés. Il ne
  # signe rien : pas d'id-token. La release reste un brouillon invisible
  # jusqu'au job `finalize`. Sauté à blanc.
  publish:
    name: Brouillon de release
    if: github.ref_type == 'tag'
    needs: [version, assemble]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release

      - name: Brouillon de release GitHub
        working-directory: release
        run: gh release create "$TAG" dist/* --draft --verify-tag --title "LUNAR $VERSION" --notes-file notes.md

  # Seul passage brouillon -> public : un échec en amont ne laisse jamais de
  # release publique partielle. L'environnement `production` permet d'exiger
  # une validation manuelle (Settings > Environments > Required reviewers).
  finalize:
    name: Publication
    needs: publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    environment:
      name: production
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Brouillon -> release publique
        run: gh release edit "$TAG" --draft=false --latest
